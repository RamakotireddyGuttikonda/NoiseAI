<!DOCTYPE html>
<html>
<head>
    <title>Prediction Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            display: flex;
        }

        /* Sidebar */
        #sidebar {
            width: 250px;
            background-color: #f0f0f0;
            padding: 15px;
            height: 100vh;
            overflow-y: auto;
            border-right: 2px solid #ccc;
        }

        #sidebar h2 {
            margin-top: 0;
        }

        #stationList li {
            margin-bottom: 6px;
            padding: 6px;
            background: #e5e5e5;
            border-radius: 4px;
            list-style: none;
        }

        /* Main content area */
        #content {
            flex: 1;
            padding: 20px;
        }

        form {
            max-width: 400px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2196f3;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0b7dda;
        }
    </style>
</head>
<body>

<!-- ======================= SIDEBAR ======================= -->
<div id="sidebar">
    <h2>Available Stations</h2>
    <ul id="stationList"></ul>
</div>

<!-- ======================= MAIN CONTENT ======================= -->
<div id="content">
    <h2>Predict Day & Night Values</h2>

    <form id="predictForm">
        <label>Model Type</label>
        <select id="model_type">
            <option value="random_forest">Random Forest</option>
        </select>

        <label>Station</label>
        <input type="text" id="station" placeholder="Enter station name" required />

        <label>Year</label>
        <input type="number" id="year" required />

        <label>Month</label>
        <input type="number" id="month" required />

        <button type="submit">Predict</button>
    </form>

    <h3>Prediction Result:</h3>
    <p id="result"></p>
</div>

<script>
// ====================== LOAD STATIONS FROM CSV ======================
const csvUrl = "noise_data_set.csv";

async function loadStations() {
    try {
        const response = await fetch(csvUrl);
        const csvText = await response.text();

        const lines = csvText.split("\n").map(l => l.trim()).filter(l => l.length > 0);

        const headers = lines[0].split(",");
        const stationIndex = headers.indexOf("Station");

        if (stationIndex === -1) {
            alert("CSV does not contain 'Station' column.");
            return;
        }

        const stationSet = new Set();  // <-- to ensure uniqueness

        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(",");
            const stationName = cols[stationIndex];
            if (stationName) stationSet.add(stationName);
        }

        // Convert set → sorted array
        const uniqueStations = Array.from(stationSet).sort();

        const stationList = document.getElementById("stationList");

        uniqueStations.forEach(stationName => {
            const li = document.createElement("li");
            li.textContent = stationName;

            li.onclick = () => {
                document.getElementById("station").value = stationName;
            };

            stationList.appendChild(li);
        });

    } catch (err) {
        console.error("Error loading CSV:", err);
    }
}

loadStations();



// ====================== HANDLE PREDICTION SUBMIT ======================
document.getElementById("predictForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const model_type = document.getElementById("model_type").value;
    const station = document.getElementById("station").value;
    const year = parseInt(document.getElementById("year").value);
    const month = parseInt(document.getElementById("month").value);

    const payload = { model_type, station, year, month };

    const res = await fetch("http://127.0.0.1:5000/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (data.error) {
        document.getElementById("result").textContent = "Error: " + data.error;
        return;
    }

    document.getElementById("result").textContent =
        `Day: ${data.day} | Night: ${data.night}`;
});
</script>

</body>
</html>
